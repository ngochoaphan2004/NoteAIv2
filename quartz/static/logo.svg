<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="noteai-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0071E3" />
      <stop offset="45%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Glass Glow Overlay -->
    <linearGradient id="noteai-glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Sparkle Gradient -->
    <linearGradient id="spark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#FB7185" />
    </linearGradient>

    <!-- Drop Shadow Filter for Iconography -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#0F172A" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Base with Apple Rounded Corner Ratio (28px radius on 120x120) -->
  <rect width="120" height="120" rx="28" fill="url(#noteai-bg)" />
  <rect width="120" height="120" rx="28" fill="url(#noteai-glass)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

  <!-- Inner Icon Group with Shadow -->
  <g filter="url(#shadow)">
    <!-- Stylized Open Book / Folding PKM Pages forming 'N' -->
    <!-- Left Page -->
    <path d="M 26 36 C 26 31, 42 28, 56 33 L 56 83 C 42 78, 26 81, 26 86 Z" fill="#FFFFFF" fill-opacity="0.97" />
    
    <!-- Right Page -->
    <path d="M 64 33 C 78 28, 94 31, 94 36 L 94 86 C 94 81, 78 78, 64 83 Z" fill="#EEF2F6" fill-opacity="0.92" />

    <!-- Central Neural Spine / Binding -->
    <path d="M 56 33 L 64 33 L 64 83 L 56 83 Z" fill="#CBD5E1" fill-opacity="0.85" />
    
    <!-- Stylized PKM Knowledge Wave Accent -->
    <path d="M 32 46 Q 44 43 54 47 L 54 51 Q 44 47 32 50 Z" fill="#0071E3" fill-opacity="0.75" />
    <path d="M 66 47 Q 76 43 88 46 L 88 50 Q 76 47 66 51 Z" fill="#2563EB" fill-opacity="0.75" />
    <path d="M 32 59 Q 44 56 54 60 L 54 64 Q 44 60 32 63 Z" fill="#0071E3" fill-opacity="0.75" />
    <path d="M 66 60 Q 76 56 88 59 L 88 63 Q 76 60 66 64 Z" fill="#2563EB" fill-opacity="0.75" />

    <!-- AI Sparkle / Star at Top Right -->
    <g transform="translate(86, 26)">
      <path d="M 0 -13 C 0 -4, 4 0, 13 0 C 4 0, 0 4, 0 13 C 0 4, -4 0, -13 0 C -4 0, 0 -4, 0 -13 Z" fill="url(#spark-grad)" />
      <circle cx="0" cy="0" r="2.5" fill="#FFFFFF" />
    </g>

    <!-- Mini secondary spark -->
    <g transform="translate(100, 42)">
      <path d="M 0 -6 C 0 -2, 2 0, 6 0 C 2 0, 0 2, 0 6 C 0 2, -2 0, -6 0 C -2 0, 0 -2, 0 -6 Z" fill="#FDE047" />
    </g>
  </g>
</svg>
