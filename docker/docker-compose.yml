name: noteai
services:
  postgres:
    image: postgres:16-alpine
    container_name: noteai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: noteai
      POSTGRES_PASSWORD: noteai_secret_password
      POSTGRES_DB: noteai_pkm
    ports:
      # Khóa chặt cổng trên 127.0.0.1 (chỉ cho phép truy cập cục bộ trên host, ngăn chặn quét port từ IP public)
      - "127.0.0.1:5433:5432"
    volumes:
      - noteai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noteai -d noteai_pkm"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: noteai_qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - noteai_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Container hợp nhất toàn bộ dự án: Backend (FastAPI Core Gateway) & Frontend (Vite React SPA)
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: noteai_app
    restart: unless-stopped
    ports:
      # Khóa chặt các cổng trên 127.0.0.1: Chặn đứng truy cập trực tiếp từ IP Public VPS, bắt buộc qua Cloudflare Tunnel
      - "127.0.0.1:8000:8000" # FastAPI Backend & Swagger Docs (/docs) + React SPA Production
      - "127.0.0.1:5173:5173" # Interactive React SPA Frontend (Dev Server)
    environment:
      - DATABASE_URL=postgresql://noteai:noteai_secret_password@postgres:5432/noteai_pkm
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=noteai_knowledge
      - CONTENT_DIR=/app/content
      - LOG_DIR=/app/logs
      - HOST=0.0.0.0
      - PORT=8000
    env_file:
      - ../backend/.env
    volumes:
      # Mount thư mục ghi chú Markdown (SSOT) để Watchdog & React SPA tự động reload/nhận ghi chú mới
      - ../content:/app/content
      # Mount thư mục backend & frontend code để cập nhật nóng (Hot-Reload)
      - ../backend:/app/backend
      - ../frontend/src:/app/frontend/src
      # Persistent Logging: Lưu trữ bền vững toàn bộ log trên máy host/VPS (Tránh mất log khi container restart)
      - ../logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  noteai_postgres_data:
  noteai_qdrant_data:
