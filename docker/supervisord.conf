[supervisord]
nodaemon=true
user=root
logfile=/app/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=5
pidfile=/var/run/supervisord.pid

[program:backend]
command=uvicorn app.main:app --host 0.0.0.0 --port 8000
directory=/app/backend
autostart=true
autorestart=true
priority=10
stdout_logfile=/app/logs/supervisor/backend.out.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/app/logs/supervisor/backend.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5

[program:quartz]
command=node ./quartz/bootstrap-cli.mjs build --serve -d content --port 8088
directory=/app
autostart=true
autorestart=true
priority=20
stdout_logfile=/app/logs/supervisor/quartz.out.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/app/logs/supervisor/quartz.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5

[program:frontend]
command=npm run dev -- --host 0.0.0.0 --port 5173
directory=/app/frontend
autostart=true
autorestart=true
priority=30
stdout_logfile=/app/logs/supervisor/frontend.out.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/app/logs/supervisor/frontend.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
