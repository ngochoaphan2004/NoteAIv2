[supervisord]
nodaemon=true
user=root
logfile=/app/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=5
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:backend]
command=uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
directory=/app/backend
autostart=true
autorestart=true
priority=10
stdout_logfile=/app/logs/supervisor/backend.out.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/app/logs/supervisor/backend.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5

[program:frontend]
command=npm run dev -- --host 0.0.0.0 --port 5173
directory=/app/frontend
autostart=true
autorestart=true
priority=20
stdout_logfile=/app/logs/supervisor/frontend.out.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/app/logs/supervisor/frontend.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
