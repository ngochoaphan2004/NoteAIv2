# ==============================================================================
# NOTEAI.V2 - PRODUCTION NGINX CONFIGURATION (PORT 80 & PORT 8088)
# ==============================================================================
# Cấu hình chuẩn chuyên nghiệp:
# 1. Toàn bộ tệp HTML (React SPA index.html & Quartz iframe) BỊ CẤM CACHE HOÀN TOÀN
#    thông qua HTTP Headers máy chủ (Cache-Control: no-store, no-cache,...).
# 2. Không dựa vào thẻ meta HTML (trình duyệt hiện đại bỏ qua meta tags).
# 3. Các assets có gắn mã hash (JS/CSS) được cache dài hạn (immutable) để tối ưu tải.
# 4. Audio streaming hỗ trợ Range requests và cache an toàn.
# ==============================================================================

# ------------------------------------------------------------------------------
# Server chính: Interactive React SPA (Port 80)
# ------------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/noteai/frontend/dist;
    index index.html;

    # Gzip nén dữ liệu cho tốc độ tối đa
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 1. API Backend Gateway
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Swagger Documentation
    location /docs {
        proxy_pass http://127.0.0.1:8000/docs;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://127.0.0.1:8000/openapi.json;
        proxy_set_header Host $host;
    }

    # 3. Static Assets của React (Vite sinh tên file có băm hash duy nhất)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 4. Tệp index.html chính - BẮT BUỘC KHÔNG ĐƯỢC CACHE Ở MỌI TRÌNH DUYỆT
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # 5. Route gốc / - Trả về index.html và ép HTTP Headers từ chối bộ đệm
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # 6. Fallback toàn bộ SPA Routing về index.html (từ chối cache)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
}

# ------------------------------------------------------------------------------
# Server Quartz v4 Digital Garden (Port 8088 - Dùng độc lập & Nhúng iFrame)
# ------------------------------------------------------------------------------
server {
    listen 8088;
    listen [::]:8088;
    server_name _;

    root /opt/noteai/public;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # 1. Audio Assets Stream: Hỗ trợ tua và tải từng đoạn (Range requests)
    location /assets/audio/ {
        add_header Cache-Control "public, max-age=86400";
        add_header Accept-Ranges bytes;
        access_log off;
    }

    # 2. Toàn bộ tài liệu HTML & iFrame của Quartz - BẮT BUỘC KHÔNG ĐƯỢC CACHE
    location ~* \.html$ {
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # 3. Định tuyến mặc định của Quartz (URL không đuôi .html) - Từ chối cache tuyệt đối
    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
}
